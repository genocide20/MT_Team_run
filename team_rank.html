<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อันดับ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 760px;
            margin: 0 auto 20px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .nav-brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #facc15;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
        }
        .nav-brand-text {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.15;
        }
        .nav-brand-subtitle {
            margin-top: 2px;
            color: rgba(255, 255, 255, 0.82);
            font-size: 12px;
            font-weight: 500;
        }
        .nav-brand-icon {
            width: 2.1em;
            height: 2.1em;
            flex: 0 0 auto;
            border-radius: 50%;
            object-fit: cover;
        }
        .nav-links {
            display: flex;
            gap: 8px;
        }
        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.18);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-link.active {
            background: white;
            color: #333;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            margin-bottom: 24px;
            font-size: 2em;
        }
        .icon {
            width: 1.15em;
            height: 1.15em;
            flex: 0 0 auto;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .icon-submit {
            color: #34d399;
        }
        .icon-rank {
            color: #facc15;
        }
        .icon-score {
            color: #38bdf8;
        }
        .icon-refresh {
            color: #bbf7d0;
        }
        .nav-link.active .icon-rank {
            color: #ca8a04;
        }
        .status-message {
            margin: 12px 0;
            text-align: center;
            min-height: 22px;
        }
        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 12px 0 20px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.16);
            font-weight: bold;
        }
        .loading-state[hidden] {
            display: none;
        }
        .loading-spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .rank-list {
            display: grid;
            gap: 10px;
        }
        .rank-row {
            display: grid;
            grid-template-columns: 72px 1fr 170px;
            align-items: center;
            column-gap: 10px;
            row-gap: 4px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.16);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
        }
        .rank-row:hover,
        .rank-row:focus-visible {
            background: rgba(255, 255, 255, 0.24);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
            transform: translateY(-1px);
            outline: none;
        }
        .rank-row.champion {
            position: relative;
            grid-template-columns: 84px 1fr 180px;
            padding: 18px 14px;
            border: 1px solid rgba(255, 255, 255, 0.72);
            background: linear-gradient(135deg, rgba(255, 214, 102, 0.95), rgba(255, 255, 255, 0.24));
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.18);
            color: #2f2300;
        }
        .rank-row.champion::after {
            content: "CHAMPION";
            position: absolute;
            top: -11px;
            right: 14px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #fff7cc;
            color: #6b4e00;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.06em;
        }
        .team-photo {
            width: 100%;
            height: 100%;
            align-self: center;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.72);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.3);
        }
        .rank-row.champion .team-photo {
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 14px 28px rgba(107, 78, 0, 0.38);
        }
        .rank-row.champion .team-name {
            font-size: 28px;
            color: #2f2300;
            text-shadow: 0 1px 0 rgba(255, 247, 204, 0.75);
        }
        .rank-row.champion .distance {
            font-size: 25px;
            color: #5f4300;
            text-shadow: 0 1px 0 rgba(255, 251, 235, 0.8);
        }
        .team-name {
            color: #f8fafc;
            font-size: 22px;
            font-weight: 800;
            align-self: center;
            line-height: 1.2;
            letter-spacing: 0.01em;
            text-shadow: 0 2px 4px rgba(15, 23, 42, 0.32), 0 0 12px rgba(125, 211, 252, 0.28);
            overflow-wrap: anywhere;
        }
        .team-rank {
            margin-right: 6px;
            color: #f97316;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.6), 0 1px 0 rgba(255, 255, 255, 0.45);
        }
        .team-rank.rank-top {
            color: #fdba74;
            text-shadow: 0 0 10px rgba(253, 186, 116, 0.65), 0 2px 4px rgba(15, 23, 42, 0.3);
        }
        .distance {
            text-align: right;
            color: #fde68a;
            font-size: 21px;
            font-weight: 800;
            align-self: center;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(15, 23, 42, 0.34), 0 0 12px rgba(250, 204, 21, 0.34);
        }
        .refresh-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .refresh-button:hover {
            background: #16a34a;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .nav-menu {
                align-items: stretch;
                flex-direction: column;
            }
            .nav-links {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.5em;
            }
            .rank-row {
                grid-template-columns: 62px 1fr;
            }
            .rank-row.champion {
                grid-template-columns: 68px 1fr;
                padding-top: 20px;
            }
            .rank-row.champion .team-name {
                font-size: 24px;
            }
            .rank-row.champion .distance {
                font-size: 21px;
            }
            .team-name {
                font-size: 19px;
            }
            .distance {
                font-size: 18px;
            }
            .distance {
                grid-column: 2;
                text-align: left;
                margin-top: -2px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-menu" aria-label="Main navigation">
        <a class="nav-brand" href="index.html">
            <img class="nav-brand-icon" src="images/walk-icon.png" alt="" aria-hidden="true">
            <span class="nav-brand-text">
                <span>MUMT Running Club</span>
                <span class="nav-brand-subtitle">Team Running</span>
            </span>
        </a>
        <div class="nav-links">
            <a class="nav-link" href="index.html">
                <svg class="icon icon-submit" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M20 16v4H4v-4"></path></svg>
                <span>ส่งผล</span>
            </a>
            <a class="nav-link active" href="team_rank.html">
                <svg class="icon icon-rank" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"></path><path d="M5 5H3v2a4 4 0 0 0 4 4"></path><path d="M19 5h2v2a4 4 0 0 1-4 4"></path></svg>
                <span>อันดับ</span>
            </a>
            <a class="nav-link" href="https://mumt-happyorganization.netlify.app/">
                <svg class="icon icon-score" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 16v-5"></path><path d="M12 16V7"></path><path d="M17 16v-8"></path></svg>
                <span>คะแนน</span>
            </a>
        </div>
    </nav>

    <main class="container">
        <h1>
            <svg class="icon icon-rank" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"></path><path d="M5 5H3v2a4 4 0 0 0 4 4"></path><path d="M19 5h2v2a4 4 0 0 1-4 4"></path></svg>
            <span>อันดับสะสมระยะทาง</span>
        </h1>
        <div id="loadingState" class="loading-state" role="status" aria-live="polite">
            <div class="loading-spinner" aria-hidden="true"></div>
            <span id="loadingText">กำลังโหลดอันดับ...</span>
        </div>
        <div id="statusMessage" class="status-message"></div>
        <div id="rankList" class="rank-list"></div>
        <button id="refreshButton" class="refresh-button" type="button">
            <svg class="icon icon-refresh" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2"></path><path d="M3 12a9 9 0 0 1 15.5-6.2"></path><path d="M18 2v4h-4"></path><path d="M6 22v-4h4"></path></svg>
            <span>โหลดใหม่</span>
        </button>
    </main>

    <script>
        const apiUrl = 'https://script.google.com/macros/s/AKfycbyLVYoa55lRiTeAAFsInE8OmwonTftQCquQF4eG6LiZvJ0IYVgIGR2MUqXj-p31vSndTQ/exec';
        const rankList = document.getElementById('rankList');
        const statusMessage = document.getElementById('statusMessage');
        const refreshButton = document.getElementById('refreshButton');
        const loadingState = document.getElementById('loadingState');
        const loadingText = document.getElementById('loadingText');
        const defaultTeamImage = 'images/images_run.jpg';
        const teamImageMap = {
            'ละมุน pace แต่ race เกินร้อย': 'images/S__29016248.jpg',
            'ดิ อเวนเจอร์': 'images/avenger.jpg',
            'พ่อบ้านเร่งฝีเท้า': 'images/S__158072845.jpg',
            'Runaway V2': 'images/runaway.png'
        };

        function toNumber(value) {
            const number = Number(value);
            return Number.isFinite(number) ? number : 0;
        }

        function getTeamImage(teamName) {
            const normalizedTeamName = String(teamName || '').trim();
            return teamImageMap[normalizedTeamName] || defaultTeamImage;
        }

        function getRankIcon(rank) {
            const keycapIcons = ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣', '🔟'];
            if (rank >= 1 && rank <= 10) {
                return keycapIcons[rank - 1];
            }
            return '🏅' + rank;
        }

        function normalizeRankData(rows) {
            const totals = new Map();

            rows.forEach(row => {
                const teamName = row.team_run || row.team_name || row.team || row.Team || row['Team Name'];
                const totalDistance = row.SUM_kg || row.sum_kg || row.total_distance || row.totalDistance || row.distance_total || row.distance;

                if (!teamName) {
                    return;
                }

                totals.set(teamName, (totals.get(teamName) || 0) + toNumber(totalDistance));
            });

            return Array.from(totals, ([team_name, total_distance]) => ({
                team_name,
                total_distance
            })).sort((a, b) => b.total_distance - a.total_distance);
        }

        function renderRankings(rankings) {
            rankList.innerHTML = '';

            if (!rankings.length) {
                statusMessage.textContent = 'ยังไม่มีข้อมูลอันดับ';
                return;
            }

            statusMessage.textContent = '';

            rankings.forEach((team, index) => {
                const row = document.createElement('div');
                row.className = 'rank-row';
                const teamUrl = 'team_player.html?team=' + encodeURIComponent(team.team_name);
                row.setAttribute('role', 'link');
                row.setAttribute('tabindex', '0');
                row.setAttribute('aria-label', 'ดูรายชื่อสมาชิกทีม ' + team.team_name);
                row.addEventListener('click', () => {
                    window.location.href = teamUrl;
                });
                row.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        window.location.href = teamUrl;
                    }
                });
                if (index === 0) {
                    row.classList.add('champion');
                }


                const teamName = document.createElement('div');
                teamName.className = 'team-name';
                teamName.innerHTML = '<span class="team-rank' + (index === 0 ? ' rank-top' : '') + '">' + getRankIcon(index + 1) + '</span>' + team.team_name;

                const teamPhoto = document.createElement('img');
                teamPhoto.className = 'team-photo';
                teamPhoto.src = getTeamImage(team.team_name);
                teamPhoto.alt = 'รูปทีม ' + team.team_name;
                teamPhoto.loading = 'lazy';

                const distance = document.createElement('div');
                distance.className = 'distance';
                distance.textContent =  toNumber(team.total_distance).toFixed(2) + ' km';

                row.appendChild(teamPhoto);
                row.appendChild(teamName);
                row.appendChild(distance);
                rankList.appendChild(row);
            });
        }

        function setPageLoading(isLoading, message) {
            loadingState.hidden = !isLoading;
            loadingText.textContent = message || 'กำลังโหลดอันดับ...';
            refreshButton.disabled = isLoading;
        }

        function loadRankings() {
            setPageLoading(true);
            statusMessage.textContent = '';
            rankList.innerHTML = '';

            fetch(apiUrl + '?action=team_rank')
                .then(response => response.json())
                .then(jsonData => {
                    const rows = Array.isArray(jsonData) ? jsonData : jsonData.data || jsonData.rankings || [];
                    renderRankings(normalizeRankData(rows));
                })
                .catch(error => {
                    console.error('Error loading team rankings:', error);
                    statusMessage.textContent = 'โหลดอันดับไม่สำเร็จ กรุณาลองใหม่';
                })
                .finally(() => {
                    setPageLoading(false);
                });
        }

        refreshButton.addEventListener('click', loadRankings);
        loadRankings();
    </script>
</body>
</html>
