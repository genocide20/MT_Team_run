<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายชื่อผู้เล่นในทีม</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 760px;
            margin: 0 auto 20px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .nav-brand {
            color: #facc15;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
        }
        .nav-links {
            display: flex;
            gap: 8px;
        }
        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.18);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-link.active {
            background: white;
            color: #333;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            margin: 0 0 10px;
            font-size: 2em;
        }
        .icon {
            width: 1.15em;
            height: 1.15em;
            flex: 0 0 auto;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .icon-submit {
            color: #34d399;
        }
        .icon-rank {
            color: #facc15;
        }
        .icon-score {
            color: #38bdf8;
        }
        .icon-team {
            color: #38bdf8;
        }
        .icon-back {
            color: #bfdbfe;
        }
        .icon-refresh {
            color: #bbf7d0;
        }
        .nav-link.active .icon-rank {
            color: #ca8a04;
        }
        .team-title {
            position: relative;
            display: block;
            width: fit-content;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0 auto 30px;
            color: #fff1f2;
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: 0.02em;
            text-shadow: 2px 2px 0 #0f766e, 4px 4px 0 rgba(250, 204, 21, 0.85);
            overflow-wrap: anywhere;
        }
        .team-title::after {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            bottom: -9px;
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, #fb7185, #facc15, #2dd4bf);
        }
        .team-image {
            display: block;
            width: min(100%, 360px);
            aspect-ratio: 16 / 9;
            margin: 0 auto 24px;
            border-radius: 8px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 14px 32px rgba(15, 23, 42, 0.26);
        }
        .status-message {
            margin: 12px 0;
            text-align: center;
            min-height: 22px;
        }
        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 12px 0 20px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.16);
            font-weight: bold;
        }
        .loading-state[hidden] {
            display: none;
        }
        .loading-spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .player-list {
            display: grid;
            gap: 10px;
        }
        .player-row {
            display: grid;
            grid-template-columns: 56px 1fr 120px;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.16);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
        }
        .player-row:hover,
        .player-row:focus-visible {
            background: rgba(255, 255, 255, 0.24);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
            transform: translateY(-1px);
            outline: none;
        }
        .player-row.team-carrier {
            position: relative;
            grid-template-columns: 64px 1fr 130px;
            padding: 18px 14px;
            border: 1px solid rgba(255, 255, 255, 0.72);
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.95), rgba(255, 255, 255, 0.22));
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.18);
            color: #052637;
        }
        .player-row.team-carrier::after {
            content: "TEAM CARRIER";
            position: absolute;
            top: -11px;
            right: 14px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #ecfeff;
            color: #075985;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.06em;
        }
        .rank-number {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffffff, #dbeafe);
            color: #075985;
            font-weight: 800;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 5px 12px rgba(14, 165, 233, 0.24);
        }
        .player-row.team-carrier .rank-number {
            width: 48px;
            height: 48px;
            background: #052637;
            color: #7dd3fc;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.32);
            box-shadow: inset 0 0 0 2px rgba(125, 211, 252, 0.45), 0 8px 18px rgba(7, 89, 133, 0.28);
        }
        .player-name {
            color: #f8fafc;
            font-weight: 800;
            letter-spacing: 0.01em;
            text-shadow: 0 2px 4px rgba(15, 23, 42, 0.32), 0 0 12px rgba(56, 189, 248, 0.28);
            overflow-wrap: anywhere;
        }
        .player-row.team-carrier .player-name {
            font-size: 20px;
            color: #052637;
            text-shadow: 0 1px 0 rgba(236, 254, 255, 0.75);
        }
        .player-row.team-carrier .distance {
            font-size: 19px;
            color: #064e3b;
            text-shadow: 0 1px 0 rgba(236, 254, 255, 0.75);
        }
        .distance {
            text-align: right;
            color: #bbf7d0;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(15, 23, 42, 0.32), 0 0 10px rgba(34, 197, 94, 0.3);
        }
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .refresh-button {
            background: #22c55e;
        }
        .refresh-button:hover {
            background: #16a34a;
        }
        .back-button {
            background: rgba(255, 255, 255, 0.18);
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.28);
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .nav-menu,
            .action-row {
                flex-direction: column;
            }
            .nav-menu {
                align-items: stretch;
            }
            .nav-links {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .action-row {
                display: grid;
                grid-template-columns: 1fr;
            }
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.5em;
            }
            .team-title {
                display: block;
                width: auto;
                font-size: 24px;
            }
            .team-image {
                margin-bottom: 18px;
            }
            .player-row {
                grid-template-columns: 48px 1fr;
            }
            .player-row.team-carrier {
                grid-template-columns: 56px 1fr;
                padding-top: 20px;
            }
            .player-row.team-carrier .rank-number {
                width: 44px;
                height: 44px;
            }
            .distance {
                grid-column: 2;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-menu" aria-label="Main navigation">
        <a class="nav-brand" href="index.html">MT Team Walk-Run</a>
        <div class="nav-links">
            <a class="nav-link" href="index.html">
                <svg class="icon icon-submit" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M20 16v4H4v-4"></path></svg>
                <span>ส่งผล</span>
            </a>
            <a class="nav-link active" href="team_rank.html">
                <svg class="icon icon-rank" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"></path><path d="M5 5H3v2a4 4 0 0 0 4 4"></path><path d="M19 5h2v2a4 4 0 0 1-4 4"></path></svg>
                <span>อันดับทีม</span>
            </a>
            <a class="nav-link" href="https://mumt-happyorganization.netlify.app/">
                <svg class="icon icon-score" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 16v-5"></path><path d="M12 16V7"></path><path d="M17 16v-8"></path></svg>
                <span>ดูคะแนน</span>
            </a>
        </div>
    </nav>

    <main class="container">
        <h1>
            <svg class="icon icon-team" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9"></path><path d="M16 3.1a4 4 0 0 1 0 7.8"></path></svg>
            <span>รายชื่อผู้เล่น</span>
        </h1>
        <div id="teamTitle" class="team-title"></div>
        <img id="teamImage" class="team-image" alt="" hidden>
        <div id="loadingState" class="loading-state" role="status" aria-live="polite">
            <div class="loading-spinner" aria-hidden="true"></div>
            <span id="loadingText">กำลังโหลดข้อมูลผู้เล่น...</span>
        </div>
        <div id="statusMessage" class="status-message"></div>
        <div id="playerList" class="player-list"></div>
        <div class="action-row">
            <a class="button back-button" href="team_rank.html">
                <svg class="icon icon-back" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                <span>กลับหน้าอันดับทีม</span>
            </a>
            <button id="refreshButton" class="button refresh-button" type="button">
                <svg class="icon icon-refresh" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2"></path><path d="M3 12a9 9 0 0 1 15.5-6.2"></path><path d="M18 2v4h-4"></path><path d="M6 22v-4h4"></path></svg>
                <span>โหลดใหม่</span>
            </button>
        </div>
    </main>

    <script>
        const apiUrl = 'https://script.google.com/macros/s/AKfycbyLVYoa55lRiTeAAFsInE8OmwonTftQCquQF4eG6LiZvJ0IYVgIGR2MUqXj-p31vSndTQ/exec';
        const teamTitle = document.getElementById('teamTitle');
        const teamImage = document.getElementById('teamImage');
        const playerList = document.getElementById('playerList');
        const statusMessage = document.getElementById('statusMessage');
        const refreshButton = document.getElementById('refreshButton');
        const loadingState = document.getElementById('loadingState');
        const loadingText = document.getElementById('loadingText');
        const selectedTeam = new URLSearchParams(window.location.search).get('team') || '';
        const specialTeamName = 'ละมุน pace แต่ race เกินร้อย';
        const defaultTeamImage = 'images/images_run.jpg';
        const specialTeamImage = 'images/S__29016248.jpg';

        function toNumber(value) {
            const number = Number(value);
            return Number.isFinite(number) ? number : 0;
        }

        function getTeamImage(teamName) {
            return String(teamName || '').trim() === specialTeamName ? specialTeamImage : defaultTeamImage;
        }

        function normalizePlayerData(rows) {
            return rows.map(row => ({
                player: row.player || row.player_name || row.Player || row['Player Name'] || '',
                total_distance: toNumber(row.total_distance || row.totalDistance || row.SUM_kg || row.sum_kg || row.distance)
            })).filter(row => row.player)
              .sort((a, b) => b.total_distance - a.total_distance);
        }

        function renderPlayers(players) {
            playerList.innerHTML = '';

            if (!players.length) {
                statusMessage.textContent = 'ยังไม่มีข้อมูลผู้เล่นในทีมนี้';
                return;
            }

            statusMessage.textContent = '';

            players.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';
                const playerUrl = 'player_detail.html?team=' + encodeURIComponent(selectedTeam) + '&player=' + encodeURIComponent(player.player);
                row.setAttribute('role', 'link');
                row.setAttribute('tabindex', '0');
                row.setAttribute('aria-label', 'ดูรายละเอียดผู้เล่น ' + player.player);
                row.addEventListener('click', () => {
                    window.location.href = playerUrl;
                });
                row.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        window.location.href = playerUrl;
                    }
                });
                if (index === 0) {
                    row.classList.add('team-carrier');
                }

                const rankNumber = document.createElement('div');
                rankNumber.className = 'rank-number';
                if (index === 0) {
                    rankNumber.innerHTML = '<svg class="icon icon-team" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 14.7 8.5 21 9.4l-4.5 4.4 1 6.2L12 17l-5.5 3 1-6.2L3 9.4l6.3-.9L12 3Z"></path></svg>';
                    rankNumber.setAttribute('aria-label', 'อันดับ 1');
                } else {
                    rankNumber.textContent = index + 1;
                }

                const playerName = document.createElement('div');
                playerName.className = 'player-name';
                playerName.textContent = player.player;

                const distance = document.createElement('div');
                distance.className = 'distance';
                distance.textContent = toNumber(player.total_distance).toFixed(2) + ' km';

                row.appendChild(rankNumber);
                row.appendChild(playerName);
                row.appendChild(distance);
                playerList.appendChild(row);
            });
        }

        function setPageLoading(isLoading, message) {
            loadingState.hidden = !isLoading;
            loadingText.textContent = message || 'กำลังโหลดข้อมูลผู้เล่น...';
            refreshButton.disabled = isLoading;
        }

        function loadPlayers() {
            if (!selectedTeam) {
                loadingState.hidden = true;
                teamTitle.textContent = 'ไม่พบชื่อทีม';
                teamImage.hidden = true;
                statusMessage.textContent = 'กรุณากลับไปเลือกทีมจากหน้าอันดับทีม';
                refreshButton.disabled = true;
                return;
            }

            teamTitle.textContent = selectedTeam;
            teamImage.src = getTeamImage(selectedTeam);
            teamImage.alt = 'รูปทีม ' + selectedTeam;
            teamImage.hidden = false;
            setPageLoading(true);
            statusMessage.textContent = '';
            playerList.innerHTML = '';

            fetch(apiUrl + '?action=team_player&team=' + encodeURIComponent(selectedTeam))
                .then(response => response.json())
                .then(jsonData => {
                    const rows = Array.isArray(jsonData) ? jsonData : jsonData.data || jsonData.players || [];
                    renderPlayers(normalizePlayerData(rows));
                })
                .catch(error => {
                    console.error('Error loading team players:', error);
                    statusMessage.textContent = 'โหลดข้อมูลผู้เล่นไม่สำเร็จ กรุณาลองใหม่';
                })
                .finally(() => {
                    setPageLoading(false);
                });
        }

        refreshButton.addEventListener('click', loadPlayers);
        loadPlayers();
    </script>
</body>
</html>
