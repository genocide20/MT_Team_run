<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายชื่อผู้เล่นในทีม</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 760px;
            margin: 0 auto 20px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .nav-brand {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }
        .nav-links {
            display: flex;
            gap: 8px;
        }
        .nav-link {
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.18);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-link.active {
            background: white;
            color: #333;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin: 0 0 10px;
            font-size: 2em;
        }
        .team-title {
            margin-bottom: 22px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            opacity: 0.95;
            overflow-wrap: anywhere;
        }
        .status-message {
            margin: 12px 0;
            text-align: center;
            min-height: 22px;
        }
        .player-list {
            display: grid;
            gap: 10px;
        }
        .player-row {
            display: grid;
            grid-template-columns: 56px 1fr 120px;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.16);
        }
        .rank-number {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            color: #333;
            font-weight: bold;
        }
        .player-name {
            font-weight: bold;
            overflow-wrap: anywhere;
        }
        .player-name a {
            color: white;
            text-decoration: none;
        }
        .player-name a:hover {
            text-decoration: underline;
        }
        .distance {
            text-align: right;
            font-weight: bold;
        }
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }
        .button {
            display: block;
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .refresh-button {
            background: #22c55e;
        }
        .refresh-button:hover {
            background: #16a34a;
        }
        .back-button {
            background: rgba(255, 255, 255, 0.18);
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.28);
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .nav-menu,
            .action-row {
                flex-direction: column;
            }
            .nav-menu {
                align-items: stretch;
            }
            .nav-links {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
            .action-row {
                display: grid;
                grid-template-columns: 1fr;
            }
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.5em;
            }
            .player-row {
                grid-template-columns: 48px 1fr;
            }
            .distance {
                grid-column: 2;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-menu" aria-label="Main navigation">
        <a class="nav-brand" href="index.html">MT Team Run</a>
        <div class="nav-links">
            <a class="nav-link" href="index.html">ส่งผล</a>
            <a class="nav-link active" href="team_rank.html">อันดับทีม</a>
        </div>
    </nav>

    <main class="container">
        <h1>รายชื่อผู้เล่น</h1>
        <div id="teamTitle" class="team-title"></div>
        <div id="statusMessage" class="status-message">กำลังโหลดข้อมูลผู้เล่น...</div>
        <div id="playerList" class="player-list"></div>
        <div class="action-row">
            <a class="button back-button" href="team_rank.html">กลับหน้าอันดับทีม</a>
            <button id="refreshButton" class="button refresh-button" type="button">โหลดใหม่</button>
        </div>
    </main>

    <script>
        const apiUrl = 'https://script.google.com/macros/s/AKfycbyLVYoa55lRiTeAAFsInE8OmwonTftQCquQF4eG6LiZvJ0IYVgIGR2MUqXj-p31vSndTQ/exec';
        const teamTitle = document.getElementById('teamTitle');
        const playerList = document.getElementById('playerList');
        const statusMessage = document.getElementById('statusMessage');
        const refreshButton = document.getElementById('refreshButton');
        const selectedTeam = new URLSearchParams(window.location.search).get('team') || '';

        function toNumber(value) {
            const number = Number(value);
            return Number.isFinite(number) ? number : 0;
        }

        function normalizePlayerData(rows) {
            return rows.map(row => ({
                player: row.player || row.player_name || row.Player || row['Player Name'] || '',
                total_distance: toNumber(row.total_distance || row.totalDistance || row.SUM_kg || row.sum_kg || row.distance)
            })).filter(row => row.player)
              .sort((a, b) => b.total_distance - a.total_distance);
        }

        function renderPlayers(players) {
            playerList.innerHTML = '';

            if (!players.length) {
                statusMessage.textContent = 'ยังไม่มีข้อมูลผู้เล่นในทีมนี้';
                return;
            }

            statusMessage.textContent = '';

            players.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';

                const rankNumber = document.createElement('div');
                rankNumber.className = 'rank-number';
                rankNumber.textContent = index + 1;

                const playerName = document.createElement('div');
                playerName.className = 'player-name';

                const playerLink = document.createElement('a');
                playerLink.href = 'player_detail.html?team=' + encodeURIComponent(selectedTeam) + '&player=' + encodeURIComponent(player.player);
                playerLink.textContent = player.player;
                playerName.appendChild(playerLink);

                const distance = document.createElement('div');
                distance.className = 'distance';
                distance.textContent = toNumber(player.total_distance).toFixed(2) + ' km';

                row.appendChild(rankNumber);
                row.appendChild(playerName);
                row.appendChild(distance);
                playerList.appendChild(row);
            });
        }

        function loadPlayers() {
            if (!selectedTeam) {
                teamTitle.textContent = 'ไม่พบชื่อทีม';
                statusMessage.textContent = 'กรุณากลับไปเลือกทีมจากหน้าอันดับทีม';
                refreshButton.disabled = true;
                return;
            }

            teamTitle.textContent = selectedTeam;
            statusMessage.textContent = 'กำลังโหลดข้อมูลผู้เล่น...';
            playerList.innerHTML = '';
            refreshButton.disabled = true;

            fetch(apiUrl + '?action=team_player&team=' + encodeURIComponent(selectedTeam))
                .then(response => response.json())
                .then(jsonData => {
                    const rows = Array.isArray(jsonData) ? jsonData : jsonData.data || jsonData.players || [];
                    renderPlayers(normalizePlayerData(rows));
                })
                .catch(error => {
                    console.error('Error loading team players:', error);
                    statusMessage.textContent = 'โหลดข้อมูลผู้เล่นไม่สำเร็จ กรุณาลองใหม่';
                })
                .finally(() => {
                    refreshButton.disabled = false;
                });
        }

        refreshButton.addEventListener('click', loadPlayers);
        loadPlayers();
    </script>
</body>
</html>
