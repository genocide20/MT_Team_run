<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติผู้เล่น</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 820px;
            margin: 0 auto 20px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .nav-brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #facc15;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
        }
        .nav-brand-text {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.15;
        }
        .nav-brand-subtitle {
            margin-top: 2px;
            color: rgba(255, 255, 255, 0.82);
            font-size: 12px;
            font-weight: 500;
        }
        .nav-brand-icon {
            width: 2.1em;
            height: 2.1em;
            flex: 0 0 auto;
            border-radius: 50%;
            object-fit: cover;
        }
        .nav-links {
            display: flex;
            gap: 8px;
        }
        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.18);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-link.active {
            background: white;
            color: #333;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            margin: 0 0 10px;
            font-size: 2em;
        }
        .icon {
            width: 1.15em;
            height: 1.15em;
            flex: 0 0 auto;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .icon-submit {
            color: #34d399;
        }
        .icon-rank {
            color: #facc15;
        }
        .icon-score {
            color: #38bdf8;
        }
        .icon-history {
            color: #c084fc;
        }
        .icon-back {
            color: #bfdbfe;
        }
        .icon-refresh {
            color: #bbf7d0;
        }
        .icon-image {
            color: #f59e0b;
        }
        .nav-link.active .icon-rank {
            color: #ca8a04;
        }
        .player-title {
            margin-bottom: 22px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            opacity: 0.95;
            overflow-wrap: anywhere;
        }
        .player-title-player {
            display: block;
            font-size: 22px;
            font-weight: 800;
            color: #86efac;
            text-shadow: 0 0 10px rgba(134, 239, 172, 0.55), 0 2px 4px rgba(15, 23, 42, 0.35);
        }
        .player-title-team {
            display: block;
            margin-top: 4px;
            font-size: 16px;
            font-weight: 600;
            opacity: 0.92;
        }
        .team-image {
            display: block;
            width: min(100%, 360px);
            height: auto;
            max-height: 420px;
            margin: 0 auto 24px;
            border-radius: 8px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 14px 32px rgba(15, 23, 42, 0.26);
        }
        .status-message {
            margin: 12px 0;
            text-align: center;
            min-height: 22px;
        }
        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 12px 0 20px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.16);
            font-weight: bold;
        }
        .loading-state[hidden] {
            display: none;
        }
        .loading-spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .history-list {
            display: grid;
            gap: 10px;
        }
        .history-row {
            display: grid;
            grid-template-columns: 1fr 120px 110px;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.16);
        }
        .date {
            font-weight: bold;
            overflow-wrap: anywhere;
        }
        .distance {
            text-align: right;
            font-weight: bold;
            color: #fef08a;
            text-shadow: 0 0 10px rgba(254, 240, 138, 0.55), 0 2px 4px rgba(15, 23, 42, 0.35);
        }
        .image-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px 10px;
            border-radius: 5px;
            background: white;
            color: #333;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }
        .image-link.disabled {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.72);
            pointer-events: none;
        }
        .image-link.disabled .icon {
            color: rgba(255, 255, 255, 0.55);
        }
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .refresh-button {
            background: #22c55e;
        }
        .refresh-button:hover {
            background: #16a34a;
        }
        .back-button {
            background: rgba(255, 255, 255, 0.18);
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.28);
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .nav-menu,
            .action-row {
                flex-direction: column;
            }
            .nav-menu {
                align-items: stretch;
            }
            .nav-links {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .action-row {
                display: grid;
                grid-template-columns: 1fr;
            }
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.5em;
            }
            .history-row {
                grid-template-columns: 1fr;
            }
            .distance {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-menu" aria-label="Main navigation">
        <a class="nav-brand" href="index.html">
            <img class="nav-brand-icon" src="images/walk-icon.png" alt="" aria-hidden="true">
            <span class="nav-brand-text">
                <span>MUMT Running Club</span>
                <span class="nav-brand-subtitle">Team Running</span>
            </span>
        </a>
        <div class="nav-links">
            <a class="nav-link" href="index.html">
                <svg class="icon icon-submit" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M20 16v4H4v-4"></path></svg>
                <span>ส่งผล</span>
            </a>
            <a class="nav-link active" href="team_rank.html">
                <svg class="icon icon-rank" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"></path><path d="M5 5H3v2a4 4 0 0 0 4 4"></path><path d="M19 5h2v2a4 4 0 0 1-4 4"></path></svg>
                <span>อันดับทีม</span>
            </a>
            <a class="nav-link" href="https://mumt-happyorganization.netlify.app/">
                <svg class="icon icon-score" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 16v-5"></path><path d="M12 16V7"></path><path d="M17 16v-8"></path></svg>
                <span>ดูคะแนน</span>
            </a>
        </div>
    </nav>

    <main class="container">
        <h1>
            <svg class="icon icon-history" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v6h6"></path><path d="M12 7v5l3 2"></path></svg>
            <span>ประวัติผู้เล่น</span>
        </h1>
        <div id="playerTitle" class="player-title"></div>
        <img id="teamImage" class="team-image" alt="" hidden>
        <div id="loadingState" class="loading-state" role="status" aria-live="polite">
            <div class="loading-spinner" aria-hidden="true"></div>
            <span id="loadingText">กำลังโหลดประวัติ...</span>
        </div>
        <div id="statusMessage" class="status-message"></div>
        <div id="historyList" class="history-list"></div>
        <div class="action-row">
            <a id="backLink" class="button back-button" href="team_rank.html">
                <svg class="icon icon-back" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                <span>กลับรายชื่อผู้เล่น</span>
            </a>
            <button id="refreshButton" class="button refresh-button" type="button">
                <svg class="icon icon-refresh" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2"></path><path d="M3 12a9 9 0 0 1 15.5-6.2"></path><path d="M18 2v4h-4"></path><path d="M6 22v-4h4"></path></svg>
                <span>โหลดใหม่</span>
            </button>
        </div>
    </main>

    <script>
        const apiUrl = 'https://script.google.com/macros/s/AKfycbyLVYoa55lRiTeAAFsInE8OmwonTftQCquQF4eG6LiZvJ0IYVgIGR2MUqXj-p31vSndTQ/exec';
        const playerTitle = document.getElementById('playerTitle');
        const teamImage = document.getElementById('teamImage');
        const historyList = document.getElementById('historyList');
        const statusMessage = document.getElementById('statusMessage');
        const refreshButton = document.getElementById('refreshButton');
        const backLink = document.getElementById('backLink');
        const loadingState = document.getElementById('loadingState');
        const loadingText = document.getElementById('loadingText');
        const params = new URLSearchParams(window.location.search);
        const selectedTeam = params.get('team') || '';
        const selectedPlayer = params.get('player') || '';
        const defaultTeamImage = 'images/images_run.jpg';
        const teamImageMap = {
            'ละมุน pace แต่ race เกินร้อย': 'images/S__29016248.jpg',
            'ดิ อเวนเจอร์': 'images/avenger.jpg',
            'พ่อบ้านเร่งฝีเท้า': 'images/S__158072845.jpg'
        };

        function toNumber(value) {
            const number = Number(value);
            return Number.isFinite(number) ? number : 0;
        }

        function getTeamImage(teamName) {
            const normalizedTeamName = String(teamName || '').trim();
            return teamImageMap[normalizedTeamName] || defaultTeamImage;
        }

        function toDate(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function formatDate(value) {
            const date = toDate(value);

            if (!date) {
                return value || '-';
            }

            return date.toLocaleDateString('th-TH', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function normalizeHistoryData(rows) {
            return rows.map(row => ({
                timestamp: row.timestamp || row.Timestamp || row.date || row.Date || '',
                distance: toNumber(row.distance || row.Distance || row.total_distance || row.SUM_kg),
                image_url: row.image_url || row.imageUrl || row.image || row.Image || ''
            })).sort((a, b) => {
                const dateA = toDate(a.timestamp);
                const dateB = toDate(b.timestamp);

                return (dateB ? dateB.getTime() : 0) - (dateA ? dateA.getTime() : 0);
            });
        }

        function renderHistory(items) {
            historyList.innerHTML = '';

            if (!items.length) {
                statusMessage.textContent = 'ยังไม่มีประวัติระยะทางของผู้เล่นคนนี้';
                return;
            }

            statusMessage.textContent = '';

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'history-row';

                const date = document.createElement('div');
                date.className = 'date';
                date.textContent = formatDate(item.timestamp);

                const distance = document.createElement('div');
                distance.className = 'distance';
                distance.textContent = toNumber(item.distance).toFixed(2) + ' km';

                const imageLink = document.createElement('a');
                imageLink.className = 'image-link';
                imageLink.innerHTML = '<svg class="icon icon-image" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="10.5" r="1.5"></circle><path d="m21 15-5-5L5 19"></path></svg><span>' + (item.image_url ? 'ดูรูปภาพ' : 'ไม่มีรูป') + '</span>';

                if (item.image_url) {
                    imageLink.href = item.image_url;
                    imageLink.target = '_blank';
                    imageLink.rel = 'noopener';
                } else {
                    imageLink.href = '#';
                    imageLink.classList.add('disabled');
                }

                row.appendChild(date);
                row.appendChild(distance);
                row.appendChild(imageLink);
                historyList.appendChild(row);
            });
        }

        function setPageLoading(isLoading, message) {
            loadingState.hidden = !isLoading;
            loadingText.textContent = message || 'กำลังโหลดประวัติ...';
            refreshButton.disabled = isLoading;
        }

        function loadHistory() {
            if (!selectedTeam || !selectedPlayer) {
                loadingState.hidden = true;
                playerTitle.textContent = 'ไม่พบข้อมูลผู้เล่น';
                teamImage.hidden = true;
                statusMessage.textContent = 'กรุณากลับไปเลือกผู้เล่นจากหน้ารายชื่อผู้เล่น';
                refreshButton.disabled = true;
                return;
            }

            playerTitle.innerHTML = '<span class="player-title-player">' + selectedPlayer + '</span><span class="player-title-team">' + selectedTeam + '</span>';
            teamImage.src = getTeamImage(selectedTeam);
            teamImage.alt = 'รูปทีม ' + selectedTeam;
            teamImage.hidden = false;
            backLink.href = 'team_player.html?team=' + encodeURIComponent(selectedTeam);
            setPageLoading(true);
            statusMessage.textContent = '';
            historyList.innerHTML = '';

            fetch(apiUrl + '?action=player_detail&team=' + encodeURIComponent(selectedTeam) + '&player=' + encodeURIComponent(selectedPlayer))
                .then(response => response.json())
                .then(jsonData => {
                    const rows = Array.isArray(jsonData) ? jsonData : jsonData.data || jsonData.history || [];
                    renderHistory(normalizeHistoryData(rows));
                })
                .catch(error => {
                    console.error('Error loading player history:', error);
                    statusMessage.textContent = 'โหลดประวัติผู้เล่นไม่สำเร็จ กรุณาลองใหม่';
                })
                .finally(() => {
                    setPageLoading(false);
                });
        }

        refreshButton.addEventListener('click', loadHistory);
        loadHistory();
    </script>
</body>
</html>
