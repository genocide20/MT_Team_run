<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เดิน-วิ่ง ทีม</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .icon {
            width: 1.15em;
            height: 1.15em;
            flex: 0 0 auto;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .icon-submit {
            color: #34d399;
        }
        .icon-rank {
            color: #facc15;
        }
        .nav-link.active .icon-submit {
            color: #16a34a;
        }
        .nav-link.active .icon-rank {
            color: #ca8a04;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 760px;
            margin: 0 auto 20px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .nav-brand {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }
        .nav-links {
            display: flex;
            gap: 8px;
        }
        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.18);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-link.active {
            background: white;
            color: #333;
        }
        label {
            display: block;
            margin: 0 0 5px;
            font-weight: bold;
        }
        select,
        input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            background: white;
            color: #333;
            margin-bottom: 20px;
        }
        select:disabled {
            background: #f0f0f0;
            color: #999;
        }
        .unit-input {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            border-radius: 5px;
            padding-right: 12px;
        }
        .unit-input input {
            flex: 1;
            margin-bottom: 0;
        }
        .unit-input span {
            color: #333;
            font-weight: bold;
        }
        input[type="file"] {
            display: none;
        }
        .upload-button,
        .submit-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }
        .upload-button {
            background: white;
            color: #333;
        }
        .submit-button {
            margin-top: 24px;
            background: #22c55e;
            color: white;
        }
        .submit-button:hover {
            background: #16a34a;
        }
        .file-name {
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.9;
        }
        .image-preview {
            display: none;
            width: 100%;
            max-height: 320px;
            margin-top: 12px;
            border-radius: 8px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.14);
        }
        .status-message {
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
        }
        .upload-warning {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 8px;
            background: rgba(250, 204, 21, 0.22);
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }
        .upload-warning.active {
            display: block;
        }
        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.16);
            font-weight: bold;
        }
        .loading-state[hidden] {
            display: none;
        }
        .loading-spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.5em;
            }
            .nav-menu {
                align-items: stretch;
                flex-direction: column;
            }
            .nav-links {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-menu" aria-label="Main navigation">
        <a class="nav-brand" href="index.html">MT Team Walk-Run</a>
        <div class="nav-links">
            <a class="nav-link active" href="index.html">
                <svg class="icon icon-submit" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M20 16v4H4v-4"></path></svg>
                <span>ส่งผล</span>
            </a>
            <a class="nav-link" href="team_rank.html">
                <svg class="icon icon-rank" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"></path><path d="M5 5H3v2a4 4 0 0 0 4 4"></path><path d="M19 5h2v2a4 4 0 0 1-4 4"></path></svg>
                <span>อันดับทีม</span>
            </a>
        </div>
    </nav>

    <main class="container">
        <h1>
            <svg class="icon icon-submit" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M20 16v4H4v-4"></path></svg>
            <span>ส่งผลเดิน-วิ่ง</span>
        </h1>

        <div id="loadingState" class="loading-state" role="status" aria-live="polite">
            <div class="loading-spinner" aria-hidden="true"></div>
            <span id="loadingText">กำลังโหลดรายชื่อทีม...</span>
        </div>

        <label for="teamSelect">เลือกทีม:</label>
        <select id="teamSelect" disabled>
            <option value="">Select a team</option>
        </select>

        <label for="playerSelect">เลือกผู้เล่น:</label>
        <select id="playerSelect" disabled>
            <option value="">Select a player</option>
        </select>

        <label for="distanceInput">ระยะทาง:</label>
        <div class="unit-input">
            <input id="distanceInput" type="number" min="0" step="0.01" placeholder="0.00">
            <span>km</span>
        </div>

        <label for="imageUpload">ภาพผลการเดิน-วิ่ง:</label>
        <label class="upload-button" for="imageUpload">Upload ภาพ</label>
        <input id="imageUpload" type="file" accept="image/*">
        <div id="fileName" class="file-name">ยังไม่ได้เลือกภาพ</div>
        <img id="imagePreview" class="image-preview" alt="Preview ภาพผลการเดิน-วิ่ง">

        <button id="submitResult" class="submit-button" type="button" disabled>ส่งผล</button>
        <div id="uploadWarning" class="upload-warning" role="alert">
            กำลังส่งผล กรุณาอย่าปิดหรือรีเฟรชหน้าเว็บจนกว่าจะส่งเสร็จ ไม่เช่นนั้นข้อมูลอาจส่งไม่สำเร็จ
        </div>
        <div id="statusMessage" class="status-message"></div>
    </main>

    <script>
        const apiUrl = 'https://script.google.com/macros/s/AKfycbxKYHJmyccYKISZL6NW3dbgnVc9svFwGAkARc0pnQ6lgRehTz7sIpAlgDerC4BiobvAbQ/exec';
        const teamSelect = document.getElementById('teamSelect');
        const playerSelect = document.getElementById('playerSelect');
        const distanceInput = document.getElementById('distanceInput');
        const imageUpload = document.getElementById('imageUpload');
        const fileName = document.getElementById('fileName');
        const imagePreview = document.getElementById('imagePreview');
        const submitResult = document.getElementById('submitResult');
        const statusMessage = document.getElementById('statusMessage');
        const uploadWarning = document.getElementById('uploadWarning');
        const loadingState = document.getElementById('loadingState');
        const loadingText = document.getElementById('loadingText');
        let imagePreviewUrl = '';
        let isSubmitting = false;

        let data = [];

        setTeamDataLoading(true);
        loadTeamData();

        function setTeamDataLoading(isLoading, message) {
            loadingState.hidden = !isLoading;
            loadingText.textContent = message || 'กำลังโหลดรายชื่อทีม...';
            teamSelect.disabled = isLoading;
            playerSelect.disabled = true;
            distanceInput.disabled = isLoading;
            imageUpload.disabled = isLoading;
            submitResult.disabled = isLoading;
        }

        function loadTeamData() {
            teamSelect.innerHTML = '<option value="">กำลังโหลดทีม...</option>';
            playerSelect.innerHTML = '<option value="">Select a player</option>';

            fetch(apiUrl)
                .then(response => {
                    console.log('Response status:', response.status);
                    return response.json();
                })
                .then(jsonData => {
                    console.log('Fetched data:', jsonData);
                    data = jsonData;
                    if (populateTeams()) {
                        setTeamDataLoading(false);
                    } else {
                        loadingState.hidden = true;
                        teamSelect.disabled = true;
                        distanceInput.disabled = true;
                        imageUpload.disabled = true;
                        submitResult.disabled = true;
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    loadingState.hidden = true;
                    teamSelect.innerHTML = '<option value="">โหลดทีมไม่สำเร็จ</option>';
                    statusMessage.textContent = 'โหลดรายชื่อทีมไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ';
                });
        }

        function populateTeams() {
            console.log('Data length:', data.length);
            if (!Array.isArray(data)) {
                console.error('Data is not an array:', data);
                statusMessage.textContent = 'API did not return an array. Response: ' + JSON.stringify(data);
                return false;
            }
            const teams = [...new Set(data.map(item => item.team_name))];
            console.log('Teams:', teams);
            teamSelect.innerHTML = '<option value="">Select a team</option>';
            if (teams.length === 0) {
                statusMessage.textContent = 'No teams found in data';
                return false;
            }
            teams.forEach(team => {
                const option = document.createElement('option');
                option.value = team;
                option.textContent = team;
                teamSelect.appendChild(option);
            });
            return true;
        }

        teamSelect.addEventListener('change', function() {
            const selectedTeam = this.value;
            playerSelect.innerHTML = '<option value="">Select a player</option>';
            if (selectedTeam) {
                const players = data.filter(item => item.team_name === selectedTeam).map(item => item.player);
                players.forEach(player => {
                    const option = document.createElement('option');
                    option.value = player;
                    option.textContent = player;
                    playerSelect.appendChild(option);
                });
                playerSelect.disabled = false;
            } else {
                playerSelect.disabled = true;
            }
        });

        imageUpload.addEventListener('change', function() {
            if (imagePreviewUrl) {
                URL.revokeObjectURL(imagePreviewUrl);
                imagePreviewUrl = '';
            }

            if (!this.files.length) {
                fileName.textContent = 'ยังไม่ได้เลือกภาพ';
                imagePreview.removeAttribute('src');
                imagePreview.style.display = 'none';
                return;
            }

            const imageFile = this.files[0];
            fileName.textContent = imageFile.name;

            if (imageFile.type.startsWith('image/')) {
                imagePreviewUrl = URL.createObjectURL(imageFile);
                imagePreview.src = imagePreviewUrl;
                imagePreview.style.display = 'block';
            } else {
                imagePreview.removeAttribute('src');
                imagePreview.style.display = 'none';
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        window.addEventListener('beforeunload', function(event) {
            if (!isSubmitting) {
                return;
            }

            event.preventDefault();
            event.returnValue = '';
        });

        function setSubmittingState(isActive) {
            isSubmitting = isActive;
            submitResult.disabled = isActive;
            submitResult.textContent = isActive ? 'กำลังอัปโหลด...' : 'ส่งผล';
            uploadWarning.classList.toggle('active', isActive);
        }

        submitResult.addEventListener('click', async function() {
            const selectedTeam = teamSelect.value;
            const selectedPlayer = playerSelect.value;
            const distance = Number(distanceInput.value);
            const imageFile = imageUpload.files[0];

            if (!selectedTeam) {
                alert('กรุณาเลือกทีม');
                return;
            }
            if (!selectedPlayer) {
                alert('กรุณาเลือกผู้เล่น');
                return;
            }
            if (!distance || distance <= 0) {
                alert('กรุณากรอกระยะทางมากกว่า 0 km');
                return;
            }
            if (!imageFile) {
                alert('กรุณาอัปโหลดภาพ');
                return;
            }
            if (!imageFile.type.startsWith('image/')) {
                alert('กรุณาเลือกไฟล์รูปภาพเท่านั้น');
                return;
            }
            if (imageFile.size > 5 * 1024 * 1024) {
                alert('กรุณาเลือกภาพขนาดไม่เกิน 5 MB');
                return;
            }

            setSubmittingState(true);
            statusMessage.textContent = 'กำลังส่งข้อมูล กรุณารอสักครู่';

            try {
                const imageData = await fileToBase64(imageFile);

                fetch(apiUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        team_name: selectedTeam,
                        player: selectedPlayer,
                        distance: distance,
                        image_name: imageFile.name,
                        image_type: imageFile.type,
                        image_data: imageData
                    })
                })
                .then(() => {
                    statusMessage.textContent = 'ส่งข้อมูลและรูปภาพเรียบร้อยแล้ว';
                    distanceInput.value = '';
                    imageUpload.value = '';
                    fileName.textContent = 'ยังไม่ได้เลือกภาพ';
                    if (imagePreviewUrl) {
                        URL.revokeObjectURL(imagePreviewUrl);
                        imagePreviewUrl = '';
                    }
                    imagePreview.removeAttribute('src');
                    imagePreview.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error submitting result:', error);
                    statusMessage.textContent = 'ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่';
                })
                .finally(() => {
                    setSubmittingState(false);
                });
            } catch (error) {
                console.error('Error reading image:', error);
                statusMessage.textContent = 'อ่านไฟล์ภาพไม่สำเร็จ กรุณาลองใหม่';
                setSubmittingState(false);
            }
        });
    </script>
</body>
</html>
