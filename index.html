<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกระยะทาง</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            background: white;
            color: #333;
        }
        select:disabled {
            background: #f0f0f0;
            color: #999;
        }
        .running-icon {
            text-align: center;
            font-size: 3em;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <h1>Select Team and Player</h1>
    <label for="teamSelect">Choose Team:</label>
    <select id="teamSelect">
        <option value="">Select a team</option>
    </select>
    
    <label for="playerSelect">Choose Player:</label>
    <select id="playerSelect" disabled>
        <option value="">Select a player</option>
    </select>

    <script>
        const apiUrl = 'https://script.google.com/macros/s/AKfycbxLrzbk6_Zw2xWJrgU2jBWY8BLSsV0a_pFJP26e_EL1Sc6l3XBhEp2y7bfSyXSOr8UNrg/exec';
        const teamSelect = document.getElementById('teamSelect');
        const playerSelect = document.getElementById('playerSelect');

        let data = [];

        // Fetch data from API
        fetch(apiUrl)
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(jsonData => {
                console.log('Fetched data:', jsonData);
                data = jsonData;
                populateTeams();
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                alert('Error fetching data: ' + error.message);
            });

        function populateTeams() {
            console.log('Data length:', data.length);
            if (!Array.isArray(data)) {
                console.error('Data is not an array:', data);
                alert('API did not return an array. Response: ' + JSON.stringify(data));
                return;
            }
            const teams = [...new Set(data.map(item => item.team_name))];
            console.log('Teams:', teams);
            if (teams.length === 0) {
                alert('No teams found in data');
                return;
            }
            teams.forEach(team => {
                const option = document.createElement('option');
                option.value = team;
                option.textContent = team;
                teamSelect.appendChild(option);
            });
        }

        teamSelect.addEventListener('change', function() {
            const selectedTeam = this.value;
            playerSelect.innerHTML = '<option value="">Select a player</option>';
            if (selectedTeam) {
                const players = data.filter(item => item.team_name === selectedTeam).map(item => item.player);
                players.forEach(player => {
                    const option = document.createElement('option');
                    option.value = player;
                    option.textContent = player;
                    playerSelect.appendChild(option);
                });
                playerSelect.disabled = false;
            } else {
                playerSelect.disabled = true;
            }
        });
    </script>
</body>
</html>
