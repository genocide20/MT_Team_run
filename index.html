<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เก็บระยะ - หมดเขตส่งผล</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #08121f;
            --bg-2: #17324f;
            --bg-3: #0f8b8d;
            --card: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.22);
            --text: #f8fbff;
            --accent: #ffd166;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: "Prompt", sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(255, 209, 102, 0.18), transparent 32%),
                radial-gradient(circle at bottom right, rgba(15, 139, 141, 0.28), transparent 34%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2) 48%, var(--bg-3));
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            inset: auto;
            border-radius: 999px;
            filter: blur(8px);
            opacity: 0.45;
            pointer-events: none;
        }

        body::before {
            width: 280px;
            height: 280px;
            top: -90px;
            right: -70px;
            background: rgba(255, 255, 255, 0.18);
        }

        body::after {
            width: 220px;
            height: 220px;
            left: -80px;
            bottom: -70px;
            background: rgba(255, 209, 102, 0.16);
        }

        .card {
            position: relative;
            width: min(92vw, 860px);
            padding: clamp(2rem, 5vw, 4.5rem);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            background: var(--card);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(14px);
            text-align: center;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: min(92vw, 860px);
            margin-bottom: 18px;
            padding: 10px 12px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(12px);
        }

        .nav-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #fff8db;
            text-decoration: none;
            font-weight: 700;
            white-space: nowrap;
        }

        .nav-brand-icon {
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 50%;
            object-fit: cover;
            flex: 0 0 auto;
        }

        .nav-brand-text {
            display: inline-flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .nav-brand-subtitle {
            margin-top: 2px;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            color: white;
            text-decoration: none;
            font-weight: 700;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.24);
        }

        .icon {
            width: 1.05em;
            height: 1.05em;
            flex: 0 0 auto;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .icon-rank {
            color: #facc15;
        }

        .icon-score {
            color: #38bdf8;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.55rem 1rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.92);
            font-size: clamp(0.9rem, 1.8vw, 1rem);
            letter-spacing: 0.04em;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.6rem, 7vw, 5.8rem);
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: 0.01em;
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        }

        .highlight {
            display: inline-block;
            color: var(--accent);
        }

        .subtext {
            margin: 1.2rem auto 0;
            max-width: 36rem;
            font-size: clamp(1.05rem, 2.2vw, 1.4rem);
            line-height: 1.6;
            color: rgba(248, 251, 255, 0.92);
        }

        .footer {
            margin-top: 1.8rem;
            font-size: 0.95rem;
            color: rgba(248, 251, 255, 0.72);
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .nav-menu {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-links {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .card {
                border-radius: 24px;
                padding: 1.6rem 1.2rem;
            }

            .subtext {
                margin-top: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-menu" aria-label="Main navigation">
        <a class="nav-brand" href="index.html">
            <img class="nav-brand-icon" src="images/walk-icon.png" alt="" aria-hidden="true">
            <span class="nav-brand-text">
                <span>MUMT Running Club</span>
                <span class="nav-brand-subtitle">Team Running</span>
            </span>
        </a>
        <div class="nav-links">
            <a class="nav-link" href="team_rank.html">
                <svg class="icon icon-rank" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 21h8"></path>
                    <path d="M12 17v4"></path>
                    <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"></path>
                    <path d="M5 5H3v2a4 4 0 0 0 4 4"></path>
                    <path d="M19 5h2v2a4 4 0 0 1-4 4"></path>
                </svg>
                <span>อันดับ</span>
            </a>
            <a class="nav-link" href="https://mumt-happyorganization.netlify.app/">
                <svg class="icon icon-score" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 3v18h18"></path>
                    <path d="M7 16v-5"></path>
                    <path d="M12 16V7"></path>
                    <path d="M17 16v-8"></path>
                </svg>
                <span>คะแนน</span>
            </a>
        </div>
    </nav>
    <main class="card" aria-label="แจ้งเตือนหมดเขตส่งผล">
        <div class="eyebrow">MUMT Running Club</div>
        <h1>
            เก็บระยะ<br>
            <span class="highlight">แบบทีม</span><br>
            หมดเขตส่งผล
        </h1>
        <p class="subtext">
            ขณะนี้ปิดรับการส่งผลแล้ว ขอบคุณทุกทีมที่ร่วมกิจกรรมและเก็บระยะอย่างเต็มที่
        </p>
        <div class="footer">โปรดติดตามประกาศหรือรอบกิจกรรมถัดไป</div>
    </main>
</body>
</html>
